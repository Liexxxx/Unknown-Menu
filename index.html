<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KeyForge · classic terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New', Courier, monospace}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a1a;padding:1.5rem}
    .term{width:100%;max-width:720px;background:#1e1e1e;border:2px solid #3a3a3a;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,0.8)}
    .term-head{background:#2a2a2a;padding:0.7rem 1.2rem;border-bottom:2px solid #3a3a3a;display:flex;align-items:center;gap:12px;border-radius:6px 6px 0 0}
    .term-head .dot{width:14px;height:14px;border-radius:50%;background:#4a4a4a;display:inline-block}
    .term-head .dot.red{background:#c05a5a}
    .term-head .dot.yellow{background:#c0a05a}
    .term-head .dot.green{background:#5ac05a}
    .term-head .title{color:#c0c0c0;font-size:1rem;letter-spacing:2px;margin-left:8px;flex:1;text-align:center;font-weight:400}
    .term-body{padding:1.8rem 1.8rem 1.5rem}
    .key-area{background:#141414;border:1px solid #333;padding:0.8rem 1.2rem;margin:0.6rem 0 1.6rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .key-value{font-family:'Courier New',monospace;font-size:2rem;font-weight:400;color:#d0d0d0;background:#0c0c0c;padding:0.1rem 1rem;border:1px solid #2a2a2a;flex:1;min-width:160px;word-break:break-all;cursor:pointer;letter-spacing:2px}
    .copy-btn{background:#2a2a2a;border:1px solid #3a3a3a;color:#d0d0d0;width:48px;height:48px;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.1s;flex-shrink:0;border-radius:4px}
    .copy-btn:hover{background:#3a3a3a}
    .copy-btn.copied{background:#1a3a1a;border-color:#4a6a4a}
    .copy-btn.copied i{color:#8bc34a}
    .action-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.8rem;margin-top:0.2rem}
    .gen-btn{background:#2a2a2a;border:1px solid #3a3a3a;padding:0.6rem 1.8rem;color:#d0d0d0;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:0.1s;border-radius:4px;font-weight:400;letter-spacing:1px}
    .gen-btn:hover{background:#3a3a3a}
    .gen-btn:disabled{opacity:0.5;cursor:default}
    .status{color:#909090;font-size:0.85rem;background:#141414;padding:0.2rem 1rem;border:1px solid #2a2a2a;display:flex;align-items:center;gap:8px;border-radius:4px}
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .status-dot.online{background:#5ac05a}
    .status-dot.offline{background:#c05a5a}
    .verify-panel{margin-top:1.6rem;padding-top:1.4rem;border-top:1px solid #2a2a2a;display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center}
    .verify-panel input{flex:1;min-width:140px;background:#141414;border:1px solid #2a2a2a;padding:0.5rem 1rem;color:#d0d0d0;font-size:0.95rem;outline:none;font-family:'Courier New',monospace;border-radius:4px}
    .verify-panel input:focus{border-color:#4a4a4a}
    .verify-panel input::placeholder{color:#555}
    .v-btn{background:#2a2a2a;border:1px solid #3a3a3a;padding:0.5rem 1.6rem;color:#d0d0d0;cursor:pointer;transition:0.1s;border-radius:4px;font-size:0.95rem;display:inline-flex;align-items:center;gap:6px}
    .v-btn:hover{background:#3a3a3a}
    .v-btn.redeem{background:#1a1a2a;border-color:#3a3a4a}
    .v-btn.redeem:hover{background:#2a2a3a}
    .result-box{margin-top:1rem;padding:0.6rem 1rem;background:#141414;border:1px solid #2a2a2a;color:#c0c0c0;font-size:0.95rem;display:none;word-break:break-all;white-space:pre-line;max-height:260px;overflow-y:auto;border-radius:4px}
    .result-box.visible{display:block}
    .result-box.valid{border-color:#2a5a2a;background:#141f14;color:#8bc34a}
    .result-box.invalid{border-color:#5a2a2a;background:#1f1414;color:#e57373}
    .result-box.error{border-color:#5a4a2a;background:#1f1a14;color:#e5a373}
    .result-box.loading{border-color:#3a4a5a;background:#141a1f;color:#aab0d0}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1e1e1e;color:#d0d0d0;padding:0.6rem 1.8rem;border:1px solid #3a3a3a;border-radius:4px;z-index:999;transition:opacity 0.2s;opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;font-size:1rem}
    .toast.show{opacity:1;pointer-events:auto}
    .foot{font-size:0.65rem;color:#4a4a4a;margin-top:12px;padding:4px 8px;background:#0c0c0c;border-radius:4px;text-align:center;border:1px solid #1a1a1a}
    @media(max-width:600px){.term-body{padding:1.2rem 1rem}.key-value{font-size:1.5rem}.copy-btn{width:42px;height:42px}}
  </style>
</head>
<body>
  <div class="term">
    <div class="term-head">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title"><i class="fas fa-key" style="margin-right:8px;"></i>KEYFORGE :: SECUREVAULT</span>
      <span style="color:#606060;font-size:0.8rem;border:1px solid #3a3a3a;padding:0.1rem 0.8rem;border-radius:4px;">24h</span>
    </div>
    <div class="term-body">
      <div class="key-area">
        <span class="key-value" id="keyDisplay">··········</span>
        <button class="copy-btn" id="copyBtn"><i class="fas fa-copy"></i></button>
      </div>
      <div class="action-row">
        <button class="gen-btn" id="generateBtn"><i class="fas fa-sync-alt"></i> generate</button>
        <span class="status">
          <span class="status-dot offline" id="statusDot"></span>
          <span id="statusText">connecting</span>
        </span>
      </div>
      <div class="verify-panel">
        <input type="text" id="verifyInput" placeholder="paste key..." spellcheck="false" />
        <button class="v-btn" id="verifyBtn"><i class="fas fa-shield-alt"></i> verify</button>
        <button class="v-btn redeem" id="redeemBtn"><i class="fas fa-link"></i> redeem</button>
      </div>
      <div class="result-box" id="resultBox"></div>
      <div class="foot" id="foot">🔒 secure channel · rsa-2048</div>
    </div>
  </div>
  <div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">copied</span></div>
  <script>
    (function(){
      var API_BASE = 'https://my-discord-bot-weathered-cherry-6777-production.up.railway.app';
      var keyDisplay = document.getElementById('keyDisplay');
      var generateBtn = document.getElementById('generateBtn');
      var copyBtn = document.getElementById('copyBtn');
      var toast = document.getElementById('toast');
      var toastMsg = document.getElementById('toastMessage');
      var toastIcon = toast.querySelector('i');
      var verifyInput = document.getElementById('verifyInput');
      var verifyBtn = document.getElementById('verifyBtn');
      var redeemBtn = document.getElementById('redeemBtn');
      var resultBox = document.getElementById('resultBox');
      var statusDot = document.getElementById('statusDot');
      var statusText = document.getElementById('statusText');
      var foot = document.getElementById('foot');
      var currentKey = '';

      function showResult(msg, type) {
        resultBox.textContent = msg;
        resultBox.classList.add('visible');
        resultBox.className = 'result-box visible';
        if (type === 'valid') resultBox.classList.add('valid');
        else if (type === 'invalid') resultBox.classList.add('invalid');
        else if (type === 'error') resultBox.classList.add('error');
        else if (type === 'loading') resultBox.classList.add('loading');
      }

      function showToast(msg, isError) {
        toastMsg.textContent = msg;
        toastIcon.className = isError ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle';
        toastIcon.style.color = isError ? '#e57373' : '#8bc34a';
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function(){ toast.classList.remove('show'); }, 3600);
      }

      function updateStatus(online, msg) {
        statusDot.className = 'status-dot ' + (online ? 'online' : 'offline');
        statusText.textContent = msg || (online ? 'online' : 'offline');
        statusText.style.color = online ? '#8bc34a' : '#e57373';
        foot.textContent = online ? '🔒 secure' : '⚠️ offline';
      }

      function copyKey() {
        if (!currentKey || currentKey === '··········') {
          showToast('generate key first', true);
          return;
        }
        navigator.clipboard.writeText(currentKey).then(function(){
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '<i class="fas fa-check"></i>';
          showToast('key copied');
          setTimeout(function(){
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
          }, 2000);
        }).catch(function(){ showToast('copy failed', true); });
      }

      async function generateKey() {
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> generating';
        showResult('generating key...', 'loading');
        try {
          var res = await fetch(API_BASE + '/generatekey?hours=24', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          if (!res.ok) {
            if (res.status === 403) throw new Error('access denied');
            if (res.status === 404) throw new Error('endpoint missing');
            throw new Error('server error ' + res.status);
          }
          var data = await res.json();
          if (data.error) throw new Error(data.error);
          currentKey = data.key;
          keyDisplay.textContent = currentKey;
          var expires = new Date(data.expires_at);
          showResult('key generated\n\n' + data.key + '\nexpires: ' + expires.toLocaleString(), 'valid');
          showToast('key generated');
          updateStatus(true, 'online');
        } catch (err) {
          showResult('error: ' + err.message, 'error');
          showToast('error: ' + err.message, true);
          keyDisplay.textContent = 'error';
          updateStatus(false, 'error');
        }
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<i class="fas fa-sync-alt"></i> generate';
      }

      async function verifyKey(key) {
        try {
          var res = await fetch(API_BASE + '/verifykey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ key: key.trim() })
          });
          if (!res.ok) {
            if (res.status === 403) throw new Error('cors block');
            if (res.status === 404) throw new Error('endpoint not found');
            throw new Error('server error ' + res.status);
          }
          return await res.json();
        } catch (err) {
          return { valid: false, reason: 'connection fail: ' + err.message };
        }
      }

      async function redeemKey(key) {
        try {
          var userId = prompt('discord user id:');
          if (!userId) return { success: false, reason: 'cancelled' };
          var res = await fetch(API_BASE + '/redeemkey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ key: key.trim(), discord_user_id: userId.trim() })
          });
          if (!res.ok) {
            if (res.status === 403) throw new Error('cors block');
            if (res.status === 404) throw new Error('endpoint not found');
            throw new Error('server error ' + res.status);
          }
          return await res.json();
        } catch (err) {
          return { success: false, reason: 'connection fail: ' + err.message };
        }
      }

      generateBtn.addEventListener('click', generateKey);
      copyBtn.addEventListener('click', copyKey);
      keyDisplay.addEventListener('click', copyKey);

      verifyBtn.addEventListener('click', async function(){
        var key = verifyInput.value.trim();
        if (!key) { showResult('enter a key to verify', 'error'); return; }
        showResult('verifying...', 'loading');
        var result = await verifyKey(key);
        if (result.valid) {
          var expires = new Date(result.keyData.expiresAt);
          showResult('valid key\n\n' + key + '\nexpires: ' + expires.toLocaleString() + '\ncreator: ' + (result.keyData.createdBy || 'system'), 'valid');
          showToast('key valid');
          updateStatus(true, 'online');
        } else {
          showResult('invalid: ' + result.reason, 'invalid');
          showToast('invalid: ' + result.reason, true);
          if (result.reason.includes('cors')) updateStatus(false, 'cors error');
        }
      });

      redeemBtn.addEventListener('click', async function(){
        var key = verifyInput.value.trim();
        if (!key) { showResult('enter key to redeem', 'error'); return; }
        showResult('redeeming...', 'loading');
        var result = await redeemKey(key);
        if (result.success) {
          var expires = new Date(result.keyData.expiresAt);
          showResult('redeemed\n\n' + key + '\nlocked to your account\nexpires: ' + expires.toLocaleString(), 'valid');
          currentKey = key;
          keyDisplay.textContent = key;
          showToast('redeemed');
          updateStatus(true, 'online');
          setTimeout(copyKey, 400);
        } else {
          showResult('redeem fail: ' + result.reason, 'invalid');
          showToast('redeem fail: ' + result.reason, true);
          if (result.reason.includes('cors')) updateStatus(false, 'cors error');
        }
      });

      verifyInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') verifyBtn.click(); });

      async function testConnection() {
        try {
          updateStatus(false, 'connecting...');
          var res = await fetch(API_BASE + '/health', { method: 'GET', signal: AbortSignal.timeout(5000) });
          if (res.ok) {
            updateStatus(true, 'online');
            showResult('connected to vault\n\nGET works. if verify/redeem fail, bot needs CORS for POST.', 'valid');
            setTimeout(function(){ if (resultBox.classList.contains('visible')) resultBox.classList.remove('visible'); }, 4800);
          } else {
            updateStatus(false, 'error ' + res.status);
          }
        } catch (err) {
          updateStatus(false, 'offline');
          showResult('cannot reach vault\n\n' + API_BASE + '\n' + err.message, 'error');
        }
      }
      testConnection();
    })();
  </script>
</body>
</html>
