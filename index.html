<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KeyForge · secure terminal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New', Courier, 'VT323', monospace}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0b0a;padding:1.5rem;position:relative}
    .crt-overlay{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center, rgba(20,30,20,0.1) 0%, rgba(0,10,0,0.4) 100%);mix-blend-mode:multiply}
    .scanline{position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 6px);animation:scan 8s linear infinite}
    @keyframes scan{0%{background-position-y:0}100%{background-position-y:100%}}
    .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 160px rgba(0,0,0,0.8)}
    .terminal{position:relative;z-index:10;width:100%;max-width:780px;background:#131210;border-radius:24px 24px 20px 20px;box-shadow:0 24px 60px rgba(0,0,0,0.9),0 0 0 2px #3f4a3a,0 0 0 4px #1e1e1a;padding:0 0 1.8rem 0;border:1px solid #3e4d3a;transition:border 0.1s}
    .terminal-header{background:#1a1f18;padding:0.9rem 1.8rem;border-radius:22px 22px 0 0;border-bottom:2px solid #364031;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .terminal-header .led{display:flex;gap:8px;align-items:center}
    .led-dot{width:12px;height:12px;border-radius:50%;background:#5e6b56;box-shadow:inset 0 1px 3px rgba(0,0,0,0.7)}
    .led-dot.green{background:#77b35c;box-shadow:0 0 10px #77b35c88, inset 0 1px 2px #b0e090}
    .led-dot.red{background:#b35c5c;box-shadow:0 0 10px #b35c5c88}
    .terminal-title{color:#b8c9a8;font-size:1.2rem;letter-spacing:3px;font-weight:400;text-shadow:0 0 6px #6d8a5a;flex:1;text-align:center;font-family:'VT323',monospace;text-transform:uppercase}
    .terminal-title i{margin-right:10px;color:#8fb07a}
    .badge-crypto{background:#1f2a1c;color:#b0c8a0;padding:0.2rem 1.2rem;border-radius:40px;font-size:0.8rem;border:1px solid #3a5535;letter-spacing:1px}
    .terminal-body{padding:1.8rem 2rem 1.2rem}
    .key-panel{background:#0e130d;border-radius:18px;padding:1.2rem 1.6rem;margin:0.6rem 0 1.8rem;border:1px solid #2f3d2a;box-shadow:inset 0 4px 12px rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:space-between;gap:1.2rem;flex-wrap:wrap}
    .key-value{font-family:'VT323','Courier New',monospace;font-size:2.4rem;font-weight:400;letter-spacing:3px;color:#d4e8c4;background:#080c06;padding:0.2rem 1.2rem;border-radius:40px;border:1px solid #3b5233;flex:1;min-width:180px;word-break:break-all;cursor:pointer;text-shadow:0 0 12px #7baa6680;transition:all 0.1s}
    .key-value:hover{background:#121f0e;border-color:#5d8050}
    .copy-btn{background:#1f2a1a;border:none;color:#c8ddb8;width:54px;height:54px;border-radius:60px;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.08s;border:1px solid #3b5233;box-shadow:0 4px 0 #0a1208,0 6px 12px rgba(0,0,0,0.7);flex-shrink:0}
    .copy-btn:hover{background:#2c3d24;transform:translateY(-2px);border-color:#5d8050}
    .copy-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a1208}
    .copy-btn.copied{background:#1f3a1a;border-color:#6b9a55}
    .copy-btn.copied i{color:#a8d690}
    .action-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem 0.6rem;margin-top:0.4rem}
    .generate-btn{background:#1d2a18;border:none;padding:0.9rem 2.2rem;border-radius:60px;font-weight:400;font-size:1.2rem;color:#d4e8c4;border:1px solid #3d5a33;box-shadow:0 5px 0 #0c150a,0 6px 12px rgba(0,0,0,0.6);cursor:pointer;display:inline-flex;align-items:center;gap:14px;transition:0.1s;font-family:'VT323',monospace;letter-spacing:1.5px}
    .generate-btn:hover{background:#283f20;transform:translateY(-2px)}
    .generate-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0c150a}
    .generate-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:0 5px 0 #0c150a}
    .status-indicator{color:#96a88a;font-size:0.9rem;background:#141f10;padding:0.3rem 1.4rem;border-radius:30px;border:1px solid #2f3d2a;display:flex;align-items:center;gap:10px;font-family:'VT323',monospace;letter-spacing:0.5px}
    .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%}
    .status-dot.online{background:#77b35c;box-shadow:0 0 16px #77b35caa}
    .status-dot.offline{background:#b35c5c;box-shadow:0 0 16px #b35c5caa}
    .verify-panel{margin-top:1.8rem;padding-top:1.5rem;border-top:2px solid #2b3825;display:flex;flex-wrap:wrap;gap:0.8rem;align-items:center}
    .verify-panel input{flex:1;min-width:140px;background:#0e130d;border:1px solid #2f3d2a;border-radius:40px;padding:0.7rem 1.4rem;color:#d4e8c4;font-size:1rem;outline:none;font-family:'VT323',monospace;letter-spacing:1.5px}
    .verify-panel input:focus{border-color:#5d8050;box-shadow:0 0 12px #3d5a3344}
    .verify-panel input::placeholder{color:#4a6040}
    .verify-btn{background:#1a2a1a;border:none;padding:0.7rem 2rem;border-radius:40px;color:#b8d8a8;font-weight:400;border:1px solid #2f4a2a;cursor:pointer;transition:0.1s;box-shadow:0 3px 0 #0f1a0f;font-family:'VT323',monospace;font-size:1.1rem;letter-spacing:1px;display:inline-flex;align-items:center;gap:8px}
    .verify-btn:hover{background:#264026;transform:translateY(-2px);border-color:#4d7040}
    .verify-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f1a0f}
    .verify-btn.redeem{background:#1a1f2a;border-color:#2a3a4a;box-shadow:0 3px 0 #0e141f}
    .verify-btn.redeem:hover{background:#27354a;border-color:#3a506a}
    .result-box{margin-top:1.2rem;padding:0.8rem 1.4rem;border-radius:14px;background:#0e130d;border:1px solid #2b3825;color:#b8c8a8;font-size:1rem;display:none;word-break:break-all;white-space:pre-line;max-height:300px;overflow-y:auto;font-family:'VT323',monospace;letter-spacing:0.5px}
    .result-box.visible{display:block}
    .result-box.valid{border-color:#3a6a2a;background:#132010;color:#b0d89a}
    .result-box.invalid{border-color:#6a2a2a;background:#1f1010;color:#d8a0a0}
    .result-box.error{border-color:#6a4a2a;background:#1f1a10;color:#d8b890}
    .result-box.loading{border-color:#3a4a5a;background:#101a1f;color:#a0b8c8}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1a1f18;color:#c8ddb8;padding:0.8rem 2.2rem;border-radius:60px;border:1px solid #3b5233;box-shadow:0 8px 30px rgba(0,0,0,0.9);z-index:999;transition:opacity 0.2s,transform 0.15s;opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;font-family:'VT323',monospace;font-size:1.2rem}
    .toast.show{opacity:1;pointer-events:auto}
    .debug-foot{font-size:0.65rem;color:#4a5a42;margin-top:12px;padding:6px 12px;background:#0a0f08;border-radius:8px;font-family:'Courier New',monospace;word-break:break-all;border:1px solid #1f2a1a;text-align:center}
    @media(max-width:600px){.terminal-body{padding:1.2rem 1rem}.key-value{font-size:1.8rem}.copy-btn{width:46px;height:46px;font-size:1.2rem}.generate-btn{padding:0.6rem 1.4rem;font-size:1rem}}
  </style>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="scanline"></div>
  <div class="vignette"></div>

  <div class="terminal">
    <div class="terminal-header">
      <div class="led">
        <span class="led-dot green"></span>
        <span class="led-dot" style="background:#5e6b56;"></span>
        <span class="led-dot red"></span>
      </div>
      <div class="terminal-title"><i class="fas fa-terminal"></i> keyforge :: secure vault</div>
      <span class="badge-crypto"><i class="fas fa-lock" style="margin-right:6px;"></i> 24h</span>
    </div>

    <div class="terminal-body">
      <div class="key-panel">
        <span class="key-value" id="keyDisplay">··········</span>
        <button class="copy-btn" id="copyBtn" aria-label="copy"><i class="fas fa-copy"></i></button>
      </div>

      <div class="action-row">
        <button class="generate-btn" id="generateBtn"><i class="fas fa-sync-alt"></i> generate</button>
        <span class="status-indicator">
          <span class="status-dot offline" id="statusDot"></span>
          <span id="statusText">connecting</span>
        </span>
      </div>

      <div class="verify-panel">
        <input type="text" id="verifyInput" placeholder="paste key..." spellcheck="false" />
        <button class="verify-btn" id="verifyBtn"><i class="fas fa-shield-alt"></i> verify</button>
        <button class="verify-btn redeem" id="redeemBtn"><i class="fas fa-link"></i> redeem</button>
      </div>
      <div class="result-box" id="resultBox"></div>
      <div class="debug-foot" id="debugFoot">🔒 secure channel · RSA-2048</div>
    </div>
  </div>

  <div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">copied</span></div>

  <script>
    (function(){
      var API_BASE = 'https://my-discord-bot-weathered-cherry-6777-production.up.railway.app';
      var keyDisplay = document.getElementById('keyDisplay');
      var generateBtn = document.getElementById('generateBtn');
      var copyBtn = document.getElementById('copyBtn');
      var toast = document.getElementById('toast');
      var toastMsg = document.getElementById('toastMessage');
      var toastIcon = toast.querySelector('i');
      var verifyInput = document.getElementById('verifyInput');
      var verifyBtn = document.getElementById('verifyBtn');
      var redeemBtn = document.getElementById('redeemBtn');
      var resultBox = document.getElementById('resultBox');
      var statusDot = document.getElementById('statusDot');
      var statusText = document.getElementById('statusText');
      var debugFoot = document.getElementById('debugFoot');
      var currentKey = '';

      function showResult(msg, type) {
        resultBox.textContent = msg;
        resultBox.classList.add('visible');
        resultBox.className = 'result-box visible';
        if (type === 'valid') resultBox.classList.add('valid');
        else if (type === 'invalid') resultBox.classList.add('invalid');
        else if (type === 'error') resultBox.classList.add('error');
        else if (type === 'loading') resultBox.classList.add('loading');
      }

      function showToast(msg, isError) {
        toastMsg.textContent = msg;
        toastIcon.className = isError ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle';
        toastIcon.style.color = isError ? '#d8a0a0' : '#b0d89a';
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function(){ toast.classList.remove('show'); }, 3600);
      }

      function updateStatus(online, msg) {
        statusDot.className = 'status-dot ' + (online ? 'online' : 'offline');
        statusText.textContent = msg || (online ? 'online' : 'offline');
        statusText.style.color = online ? '#b0d89a' : '#d8a0a0';
        debugFoot.textContent = online ? '🔒 secure · ' + API_BASE.replace(/^https?:\/\//,'') : '⚠️ offline · retry';
      }

      function copyKey() {
        if (!currentKey || currentKey === '··········') {
          showToast('generate key first', true);
          return;
        }
        navigator.clipboard.writeText(currentKey).then(function(){
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '<i class="fas fa-check"></i>';
          showToast('key copied');
          setTimeout(function(){
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
          }, 2000);
        }).catch(function(){ showToast('copy failed', true); });
      }

      async function generateKey() {
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> generating';
        showResult('⏳ generating secure key...', 'loading');
        try {
          var res = await fetch(API_BASE + '/generatekey?hours=24', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          if (!res.ok) {
            if (res.status === 403) throw new Error('access denied (CORS)');
            if (res.status === 404) throw new Error('endpoint missing');
            throw new Error('server error ' + res.status);
          }
          var data = await res.json();
          if (data.error) throw new Error(data.error);
          currentKey = data.key;
          keyDisplay.textContent = currentKey;
          var expires = new Date(data.expires_at);
          showResult('✅ key generated\n\n' + data.key + '\nexpires: ' + expires.toLocaleString(), 'valid');
          showToast('key generated');
          updateStatus(true, 'online');
        } catch (err) {
          showResult('❌ ' + err.message, 'error');
          showToast('error: ' + err.message, true);
          keyDisplay.textContent = '⚠️ error';
          updateStatus(false, 'error');
        }
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<i class="fas fa-sync-alt"></i> generate';
      }

      async function verifyKey(key) {
        try {
          var res = await fetch(API_BASE + '/verifykey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ key: key.trim() })
          });
          if (!res.ok) {
            if (res.status === 403) throw new Error('CORS block (POST)');
            if (res.status === 404) throw new Error('endpoint not found');
            throw new Error('server error ' + res.status);
          }
          return await res.json();
        } catch (err) {
          return { valid: false, reason: 'connection fail: ' + err.message };
        }
      }

      async function redeemKey(key) {
        try {
          var userId = prompt('Discord user ID:');
          if (!userId) return { success: false, reason: 'cancelled' };
          var res = await fetch(API_BASE + '/redeemkey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ key: key.trim(), discord_user_id: userId.trim() })
          });
          if (!res.ok) {
            if (res.status === 403) throw new Error('CORS block (POST)');
            if (res.status === 404) throw new Error('endpoint not found');
            throw new Error('server error ' + res.status);
          }
          return await res.json();
        } catch (err) {
          return { success: false, reason: 'connection fail: ' + err.message };
        }
      }

      generateBtn.addEventListener('click', generateKey);
      copyBtn.addEventListener('click', copyKey);
      keyDisplay.addEventListener('click', copyKey);

      verifyBtn.addEventListener('click', async function(){
        var key = verifyInput.value.trim();
        if (!key) { showResult('enter a key to verify', 'error'); return; }
        showResult('⏳ verifying ...', 'loading');
        var result = await verifyKey(key);
        if (result.valid) {
          var expires = new Date(result.keyData.expiresAt);
          showResult('✅ valid key\n\n' + key + '\nexpires: ' + expires.toLocaleString() + '\ncreator: ' + (result.keyData.createdBy || 'system'), 'valid');
          showToast('key valid');
          updateStatus(true, 'online');
        } else {
          showResult('❌ ' + result.reason + '\n\n(cors? check bot headers)', 'invalid');
          showToast('invalid: ' + result.reason, true);
          if (result.reason.includes('CORS')) updateStatus(false, 'cors error');
        }
      });

      redeemBtn.addEventListener('click', async function(){
        var key = verifyInput.value.trim();
        if (!key) { showResult('enter key to redeem', 'error'); return; }
        showResult('⏳ redeeming ...', 'loading');
        var result = await redeemKey(key);
        if (result.success) {
          var expires = new Date(result.keyData.expiresAt);
          showResult('✅ redeemed\n\n' + key + '\nlocked to your account\nexpires: ' + expires.toLocaleString(), 'valid');
          currentKey = key;
          keyDisplay.textContent = key;
          showToast('redeemed!');
          updateStatus(true, 'online');
          setTimeout(copyKey, 400);
        } else {
          showResult('❌ ' + result.reason + '\n\n(cors? check bot headers)', 'invalid');
          showToast('redeem fail: ' + result.reason, true);
          if (result.reason.includes('CORS')) updateStatus(false, 'cors error');
        }
      });

      verifyInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') verifyBtn.click(); });

      async function testConnection() {
        try {
          updateStatus(false, 'connecting...');
          var res = await fetch(API_BASE + '/health', { method: 'GET', signal: AbortSignal.timeout(5000) });
          if (res.ok) {
            updateStatus(true, 'online');
            showResult('✅ connected to vault\n\nGET works. if verify/redeem fail, bot needs CORS for POST.', 'valid');
            setTimeout(function(){ if (resultBox.classList.contains('visible')) resultBox.classList.remove('visible'); }, 4800);
          } else {
            updateStatus(false, 'error ' + res.status);
          }
        } catch (err) {
          updateStatus(false, 'offline');
          showResult('⚠️ cannot reach vault\n\n' + API_BASE + '\n' + err.message, 'error');
        }
      }

      testConnection();
    })();
  </script>
</body>
</html>
