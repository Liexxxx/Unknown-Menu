<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KeyForge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0e0e;padding:1.5rem}
    .bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 30% 40%,#1a1a1a 0%,#0a0a0a 100%)}
    .star{position:absolute;width:4px;height:4px;background:#b0b0b0;border-radius:50%;box-shadow:0 0 8px rgba(200,200,200,.3);animation:t 3s infinite alternate ease-in-out}
    @keyframes t{0%{opacity:.2;transform:scale(.9)}100%{opacity:1;transform:scale(1.2)}}
    .card{position:relative;z-index:10;width:100%;max-width:760px;background:#232323;border-radius:2.5rem;padding:2.8rem 2.5rem 3rem;box-shadow:0 20px 40px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04);border:1px solid #3a3a3a}
    .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:.75rem 1rem}
    .hdr h2{font-weight:500;font-size:1.2rem;color:#ddd;background:#1a1a1a;padding:.4rem 1.2rem;border-radius:40px;border:1px solid #3d3d3d;display:inline-flex;align-items:center;gap:10px}
    .b24{background:#1a1a1a;color:#eaeaea;padding:.3rem 1.2rem;border-radius:40px;font-size:.85rem;border:1px solid #3f3f3f}
    .disp{background:#151515;border-radius:2rem;padding:1.2rem 1.8rem;margin:1.8rem 0 2.2rem;border:1px solid #3a3a3a;box-shadow:inset 0 6px 10px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.2rem}
    .val{font-family:'SF Mono','Fira Code',monospace;font-size:1.8rem;font-weight:500;letter-spacing:1.5px;color:#f0f0f0;background:#0e0e0e;padding:.3rem 1.2rem;border-radius:60px;border:1px solid #333;flex:1;min-width:180px;word-break:break-all;cursor:pointer}
    .cp{background:#2b2b2b;border:none;color:#f0f0f0;width:54px;height:54px;border-radius:60px;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;border:1px solid #444;box-shadow:0 4px 0 #111,0 6px 12px rgba(0,0,0,.6);flex-shrink:0}
    .cp:hover{background:#363636;transform:translateY(-2px)}
    .cp:active{transform:translateY(4px);box-shadow:0 1px 0 #111}
    .cp.cpd{background:#2a4a2a;border-color:#5a8a5a}
    .cp.cpd i{color:#8bc34a}
    .act{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.2rem .8rem;margin-top:.8rem}
    .gen{background:#2a2a2a;border:none;padding:.9rem 2.5rem;border-radius:60px;font-weight:500;font-size:1.1rem;color:#ececec;border:1px solid #3f3f3f;box-shadow:0 5px 0 #131313,0 6px 12px rgba(0,0,0,.5);cursor:pointer;display:inline-flex;align-items:center;gap:12px;transition:.12s}
    .gen:hover{background:#333;transform:translateY(-2px)}
    .gen:active{transform:translateY(5px);box-shadow:0 1px 0 #131313}
    .gen:disabled{opacity:.5;cursor:not-allowed}
    .inf{color:#9a9a9a;font-size:.85rem;background:#1a1a1a;padding:.3rem 1.2rem;border-radius:30px;border:1px solid #333}
    .vsec{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #333;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
    .vsec input{flex:1;min-width:160px;background:#151515;border:1px solid #3a3a3a;border-radius:40px;padding:.7rem 1.2rem;color:#eee;font-size:.95rem;outline:none;font-family:'SF Mono',monospace;letter-spacing:.5px}
    .vsec input:focus{border-color:#5a5a5a}
    .vb{background:#1e3a3a;border:none;padding:.7rem 1.8rem;border-radius:40px;color:#b0e0e0;font-weight:500;border:1px solid #2a5a5a;cursor:pointer;transition:.12s;box-shadow:0 3px 0 #0a2a2a}
    .vb:hover{background:#2a4a4a;transform:translateY(-2px)}
    .vb:active{transform:translateY(3px);box-shadow:0 1px 0 #0a2a2a}
    .rb{margin-top:1rem;padding:.8rem 1.2rem;border-radius:16px;background:#1a1a1a;border:1px solid #333;color:#ccc;font-size:.95rem;display:none;word-break:break-all}
    .rb.v{display:block}
    .rb.ok{border-color:#2a6a2a;background:#1a2a1a;color:#8bc34a}
    .rb.err{border-color:#6a2a2a;background:#2a1a1a;color:#e57373}
    .tst{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#e0e0e0;padding:.9rem 2rem;border-radius:60px;border:1px solid #444;box-shadow:0 8px 30px rgba(0,0,0,.8);z-index:999;transition:opacity .25s;opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px}
    .tst.s{opacity:1;pointer-events:auto}
    @media(max-width:550px){.card{padding:1.8rem 1.2rem}.val{font-size:1.3rem;padding:.2rem .8rem}.cp{width:48px;height:48px;font-size:1.3rem}.gen{padding:.7rem 1.6rem;font-size:1rem}}
  </style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="card">
  <div class="hdr"><h2><i class="fas fa-key"></i> KEYFORGE</h2><span class="b24"><i class="far fa-clock" style="margin-right:6px"></i> 24h</span></div>
  <div class="disp"><span class="val" id="kd">··········</span><button class="cp" id="cb"><i class="fas fa-copy"></i></button></div>
  <div class="act"><button class="gen" id="gb"><i class="fas fa-sync-alt"></i> Generate</button><span class="inf"><i class="fas fa-asterisk" style="font-size:.6rem"></i> bot</span></div>
  <div class="vsec"><input type="text" id="vi" placeholder="Enter key..." spellcheck="false" /><button class="vb" id="vb"><i class="fas fa-shield-alt"></i> Verify</button><button class="vb" id="rb" style="background:#2a2a3a;border-color:#3a3a5a"><i class="fas fa-link"></i> Redeem</button></div>
  <div class="rb" id="res"></div>
</div>
<div class="tst" id="tst"><i class="fas fa-check-circle" style="color:#8bc34a"></i> <span id="tmsg">Copied!</span></div>
